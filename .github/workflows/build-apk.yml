name: Build OPTCG Z Fold 8 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Auto-Fix Project Structure & Gradle Configs
        run: |
          # 1. Create required gradle.properties for Jetpack Compose & AndroidX
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 2. Ensure settings.gradle.kts is exact
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OPTCGFoldMeta"
          include(":app")
          EOF

          # 3. Ensure root build.gradle.kts uses matched AGP 8.4.2 & Kotlin 1.9.24
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. Ensure folder structure exists and rescue MainActivity.kt if misplaced
          mkdir -p app/src/main/java/com/optcg/foldmeta
          FOUND_MAIN=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$FOUND_MAIN" ] && [ "$FOUND_MAIN" != "./app/src/main/java/com/optcg/foldmeta/MainActivity.kt" ]; then
              cp "$FOUND_MAIN" app/src/main/java/com/optcg/foldmeta/MainActivity.kt
          fi

          # 5. Ensure app/src/main/AndroidManifest.xml is in the right place
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="OPTCG Fold 8 Optimizer"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <property
                      android:name="android.window.PROPERTY_COMPAT_ALLOW_MIN_ASPECT_RATIO_OVERRIDE"
                      android:value="true" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:resizeableActivity="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Write matched app/build.gradle.kts (SDK 34 + Compose 2024.06.00 + Kotlin 1.9.24)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.optcg.foldmeta"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.optcg.foldmeta"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0-CompleteMaster"
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.material3:material3-window-size-class")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.window:window:1.3.0")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: OPTCG-Fold8-Master-APK
          path: app/build/outputs/apk/debug/app-debug.apk
