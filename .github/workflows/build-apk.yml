name: Build OPTCG Z Fold 8 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with Java 17 Toolchain
        run: |
          # 1. Write gradle.properties without EOF blocks
          printf "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

          # 2. Ensure root build.gradle.kts has matched AGP 8.4.2 & Kotlin 1.9.24
          printf 'plugins {\n    id("com.android.application") version "8.4.2" apply false\n    id("org.jetbrains.kotlin.android") version "1.9.24" apply false\n}\n' > build.gradle.kts

          # 3. Ensure MainActivity.kt is in the exact folder
          mkdir -p app/src/main/java/com/optcg/foldmeta
          FOUND_MAIN=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$FOUND_MAIN" ] && [ "$FOUND_MAIN" != "./app/src/main/java/com/optcg/foldmeta/MainActivity.kt" ]; then
              cp "$FOUND_MAIN" app/src/main/java/com/optcg/foldmeta/MainActivity.kt
          fi

          # 4. Strip deprecated package attribute from AndroidManifest.xml if present
          sed -i 's/package="com.optcg.foldmeta"//g' app/src/main/AndroidManifest.xml

          # 5. Download Gradle 8.7 directly
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/

          # 6. Compile Debug APK
          set +e
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon > build_output.log 2>&1
          BUILD_EXIT_CODE=$?
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
              echo "### ❌ Compiler Error Details" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              grep -E "(^e: |FAILURE:|What went wrong:|Execution failed|Unresolved reference)" -A 5 build_output.log | tail -n 60 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat build_output.log
              exit $BUILD_EXIT_CODE
          fi

          echo "### ✅ APK Built Successfully!" >> $GITHUB_STEP_SUMMARY

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: OPTCG-Fold8-Master-APK
          path: app/build/outputs/apk/debug/app-debug.apk
